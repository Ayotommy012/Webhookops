services:
  postgres:
    image: postgres:17-alpine
    container_name: webhookops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: webhookops
      POSTGRES_USER: webhookops
      POSTGRES_PASSWORD: webhookops_dev_password
    ports:
      - "5433:5432"
    volumes:
      - webhookops_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webhookops -d webhookops"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: webhookops-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - webhookops_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  webhookops_postgres_data:
  webhookops_redis_data:
